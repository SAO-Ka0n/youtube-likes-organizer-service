name: Setup request
description: Request a solo setup for YouTube likes organization
title: "Setup request: "
labels:
  - sales
body:
  - type: input
    id: use_case
    attributes:
      label: Main use case
      placeholder: Creator research archive / study library / private reference system
    validations:
      required: true
  - type: input
    id: volume
    attributes:
      label: Approximate number of liked videos
      placeholder: 500
    validations:
      required: true
  - type: dropdown
    id: notion
    attributes:
      label: Notion needed?
      options:
        - Yes, include Notion sync
        - No, playlists only
        - Not sure yet
    validations:
      required: true
  - type: dropdown
    id: timeline
    attributes:
      label: Purchase timeline
      options:
        - Within 72 hours
        - This month
        - Researching options
    validations:
      required: true
  - type: input
    id: contact
    attributes:
      label: Preferred contact method
      placeholder: name@example.com
    validations:
      required: true

name: Team quote request
description: Request a quote for a team or research lab workflow
title: "Team quote request: "
labels:
  - sales
  - team-sales
body:
  - type: input
    id: organization
    attributes:
      label: Organization
      placeholder: Research Lab / Creator Studio / School
    validations:
      required: true
  - type: input
    id: seats
    attributes:
      label: Estimated seats or reviewers
      placeholder: 6
    validations:
      required: true
  - type: textarea
    id: workflow
    attributes:
      label: Workflow
      description: Describe how the team saves, reviews, and reuses videos.
      placeholder: We need private topic playlists and a shared Notion database for a research team.
    validations:
      required: true
  - type: input
    id: country
    attributes:
      label: Billing country
      placeholder: Japan
    validations:
      required: true
  - type: dropdown
    id: billing_route
    attributes:
      label: Billing route
      options:
        - Quote first
        - Invoice preferred
        - Checkout link preferred
    validations:
      required: true
  - type: input
    id: contact
    attributes:
      label: Preferred contact method
      placeholder: name@example.com
    validations:
      required: true
